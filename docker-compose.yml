services:
  backend:
    build:
      context: ./uvicorn-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_NAME: /data/inventory.db
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8080
    volumes:
      - ./data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: